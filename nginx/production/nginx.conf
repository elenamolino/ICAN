server {

    listen 443 ssl;
    server_name ican.score.us.es;
    client_max_body_size 100M;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    large_client_header_buffers 8 64k; # Ajusta según tus necesidades
    client_header_buffer_size 64k;    # Ajusta el tamaño del buffer

    # Resolver los contenedores en cada petición con el DNS de Docker. Con el nombre
    # fijo en proxy_pass, nginx guarda la IP del arranque y, al recrear server o client,
    # puede acabar enviando las peticiones al contenedor equivocado (502).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $mongo_express http://mongo-express:8081;
    set $api http://server:8080;
    set $frontend http://client:5173;

    location /db-admin {
        include             fastcgi_params;
        proxy_pass          $mongo_express;
        proxy_redirect      off;

        proxy_connect_timeout 500;
        proxy_read_timeout 500;

        proxy_set_header    Host            $host;
        proxy_set_header    X-Real-IP       $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/v1 {
        include             fastcgi_params;
        proxy_pass          $api;
        proxy_redirect      off;

        proxy_connect_timeout 500;
        proxy_read_timeout 500;

        proxy_set_header    Host            $host;
        proxy_set_header    X-Real-IP       $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;

    }

    location /static {
        include             fastcgi_params;
        proxy_pass          $api;
        proxy_redirect      off;

        proxy_connect_timeout 500;
        proxy_read_timeout 500;

        proxy_set_header    Host            $host;
        proxy_set_header    X-Real-IP       $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;

    }

    location / {
        include             fastcgi_params;
        proxy_pass          $frontend;
        proxy_redirect      off;

        proxy_connect_timeout 500;
        proxy_read_timeout 500;

        proxy_set_header    Host            $host;
        proxy_set_header    X-Real-IP       $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;

    }
}

server {
    listen 80;
    server_name ican.score.us.es;
    large_client_header_buffers 8 64k; # Ajusta según tus necesidades
    client_header_buffer_size 64k;    # Ajusta el tamaño del buffer

    location / {
        return 301 https://$host$request_uri;
    }
}