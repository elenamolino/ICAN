services:
  mongodb:
      image: mongo:4.4
      ports:
        - "27017:27017"
      env_file:
        - ../../api/.env.production
      volumes:
        - 'sphere-mongodb:/data/db'
        - '../../api/init-mongo.sh:/docker-entrypoint-initdb.d/init-mongo.sh'
      networks:
        - sphere-network
  redis:
    image: redis:7.4.2
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "--raw", "incr", "ping" ]
    volumes:
      - 'redis_data:/data'
    networks:
      - sphere-network
  # unfair-tos-detector microservice (contract clause classification).
  # Published from github.com/elenamolino/unfair-terms-detector-app via
  # .github/workflows/publish.yml.
  unfair-tos-detector:
    restart: always
    image: ghcr.io/elenamolino/unfair-tos-detector:latest
    environment:
      HTTP_PROXY: http://proxy.int.local:3128
      HTTPS_PROXY: http://proxy.int.local:3128
      NO_PROXY: 127.0.0.1,localhost,192.168.20.59,.int.local
      NODE_USE_ENV_PROXY: "1"
    networks:
      - sphere-network
  # tos-to-odrl microservice (ToS -> ODRL policy pipeline), backend only —
  # ICAN never talks to its standalone Next.js report viewer. Published from
  # github.com/elenamolino/AM-TOSL via .github/workflows/publish.yml. Job
  # storage lives in ICAN's own `mongodb` service under a separate database
  # (MONGODB_DB below) — no need for a second Mongo container. Secrets
  # (Mongo URI + API keys) live in docker/production/.env.tos-to-odrl
  # (gitignored — see .env.tos-to-odrl.example).
  tos-to-odrl-backend:
    restart: always
    image: ghcr.io/elenamolino/tos-to-odrl:latest
    environment:
      HTTP_PROXY: http://proxy.int.local:3128
      HTTPS_PROXY: http://proxy.int.local:3128
      NO_PROXY: 127.0.0.1,localhost,mongodb,unfair-tos-detector,.int.local
    env_file:
      - .env.tos-to-odrl
    depends_on:
      - mongodb
    networks:
      - sphere-network
  mongo-express:
    image: mongo-express:latest
    restart: unless-stopped
    environment:
      ME_CONFIG_SITE_BASEURL: /db-admin/
      ME_CONFIG_MONGODB_URL: ${MONGO_EXPRESS_URL}
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USERNAME:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD:-password}
    ports:
      - "8081:8081"
    networks:
      - sphere-network
  server:
    restart: always
    container_name: sphere-server
    build:
        context: ../../api
        dockerfile: ./docker/production/Dockerfile
    ports:
      - 8080:8080
    env_file:
      - ../../api/.env.production
      - .env
    volumes:
      - 'sphere-statics:/usr/src/server/public'
      - ../../api/public/static/avatars:/usr/src/server/public/static/avatars
    depends_on:
      - mongodb
      - redis
      - unfair-tos-detector
      - tos-to-odrl-backend
    links:
      - mongodb
      - redis
      - unfair-tos-detector
      - tos-to-odrl-backend
    networks:
      - sphere-network
  client:
    restart: always
    container_name: sphere-client
    build:
        context: ../../frontend
        dockerfile: ./docker/production/Dockerfile
    ports:
      - 5173:5173
    env_file:
      - ../../frontend/.env.production
    networks:
      - sphere-network
  nginx:
    restart: always
    container_name: sphere-nginx
    build:
        context: ../../nginx/production
        dockerfile: ./Dockerfile
    ports:
      - 80:80
      - 443:443
    depends_on:
      - server
      - client
    volumes:
      - '../../nginx/production/ssl:/etc/nginx/ssl'
    networks:
      - sphere-network
volumes:
  sphere-mongodb:
    driver: local
  sphere-statics:
    driver: local
  redis_data:
    driver: local
networks:
  sphere-network:
    driver: bridge
