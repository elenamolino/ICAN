version: '3'

services:
  mongodb:
      image: mongo:7.0.16
      ports:
        - "27017:27017"
      env_file:
        - ../../api/.env.testing
      volumes:
        - 'dev-mongodb:/data/db'
        - '../../api/init-mongo.sh:/docker-entrypoint-initdb.d/init-mongo.sh'
      networks:
        - dev-network
  redis:
    image: redis:7.4.2
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "--raw", "incr", "ping" ]
    volumes:
      - 'redis_data:/data'
  # unfair-tos-detector microservice (contract clause classification).
  # Published from github.com/elenamolino/unfair-terms-detector-app via
  # .github/workflows/publish.yml — no local checkout needed.
  # api/.env.testing points ANALYZER_SERVICE_URL at http://localhost:3010 (host
  # port below) -- 3000/3001 were already taken by other local containers.
  unfair-tos-detector:
    image: ghcr.io/elenamolino/unfair-tos-detector:latest
    ports:
      - "3010:3000"
    networks:
      - dev-network
volumes:
  dev-mongodb:
    driver: local
  redis_data:
    driver: local
networks:
  dev-network:
    driver: bridge